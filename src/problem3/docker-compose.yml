# Local/dev topology for the platform.
#
# Notes on choices that aren't obvious:
#  * API_HOST/API_PORT are declared once and consumed by BOTH the api and nginx.
#    The original bug was nginx proxying to :3001 while the app listened on :3000.
#    Fixing the number would have fixed the symptom; sharing the variable fixes
#    the class of bug, because the two can no longer drift.
#  * Every dependency edge uses condition: service_healthy. Plain depends_on only
#    waits for the container to start, which is not the same as ready.
#  * Image tags are pinned to a minor here for readability. In production these
#    would be digest-pinned (nginx@sha256:...) with Renovate raising the bumps.

x-logging: &default-logging
  # Without this, json-file logs grow until the host disk is full.
  # See src/problem2 for what that morning looks like.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${LISTEN_PORT:-8080}:80"
    environment:
      # Substituted into nginx/templates/*.template by the image entrypoint at
      # boot. Single source of truth for the upstream address.
      API_HOST: ${API_HOST:-api}
      API_PORT: ${API_PORT:-3000}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  api:
    build:
      context: ./api
      args:
        NODE_VERSION: ${NODE_VERSION:-20-alpine}
    # No host port mapping: the API is only reachable through nginx.
    expose:
      - "${API_PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-appdb}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_not_a_secret}
      # 4 API replicas x 10 = 40 connections, and postgres is started with
      # max_connections=60. Leaves room for admin sessions and an exporter.
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /readyz checks the database. /healthz would pass while the API was
      # useless, which is exactly the mistake the original /status endpoint made.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${API_PORT:-3000}/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    init: true          # PID 1 that reaps zombies and forwards SIGTERM
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 256M }

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_not_a_secret}
    # max_connections belongs here, not in init.sql. ALTER SYSTEM in an init
    # script needs a restart to take effect, and the original init.sql was
    # never mounted anyway, so its ALTER SYSTEM was dead config.
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=250ms
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  redis:
    image: redis:7-alpine
    # Bounded memory with an eviction policy: this is a cache, so losing cold
    # keys under pressure is correct behaviour, not a failure.
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 192M }

volumes:
  postgres_data:
